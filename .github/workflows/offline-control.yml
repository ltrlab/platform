name: Offline control gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/dev.lock
            requirements/cross-build.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select baseline Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup override set 1.98.1
      - run: python scripts/dev.py setup
      - name: Configure Windows software rendering and verify a fresh renderer child
        if: runner.os == 'Windows'
        run: python scripts/ci_windows_gl.py
      - name: Build mandatory ARM64 release inputs
        run: python scripts/build_release.py --bootstrap
      - name: Configure Linux offscreen rendering
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libosmesa6
          echo "MUJOCO_GL=osmesa" >> "$GITHUB_ENV"
      # Temporary: the first Linux run lost its runner to a shutdown signal 5.5 minutes into pytest, and with it every
      # log. This streams what would otherwise die with the runner. Removed once the cause is known.
      - name: Run the gate, streaming tests and machine state to the console
        if: runner.os == 'Linux'
        shell: bash
        env:
          PYTEST_ADDOPTS: -vv
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          cat /proc/$$/cgroup
          unit="$(sed -n 's|^0::/system.slice/\([^/]*\).*|\1|p' /proc/$$/cgroup)"
          [ -z "$unit" ] || systemctl show "$unit" -p OOMPolicy -p KillMode -p MemoryMax || true
          nproc; free -m; swapon --show; df -h . /dev/shm
          ( set +e; sudo journalctl -f -n 0 --no-pager -o short-precise | grep --line-buffered -v -E 'sudo|pam_unix' | sed -u 's/^/journal: /' ) &
          ( set +e; until log="$(ls -t build/dev-check/*/output.log 2>/dev/null | head -1)" && [ -n "$log" ]; do sleep 1; done; tail -n +1 -F "$log" | cut -c1-200 ) &
          (
            set +e
            while sleep 5; do
              echo "machine: $(date -u +%T) $(free -m | awk '/Mem:/{print "used="$3" avail="$7}/Swap:/{print "swap="$3}' | tr '\n' ' ')shm=$(du -sm /dev/shm | cut -f1)M tmp_free=$(df -m --output=avail . | tail -1 | tr -d ' ')M procs=$(ps -e --no-headers | wc -l)"
              ps -eo rss=,etimes=,pid=,args= --sort=-rss | head -3 | cut -c1-150 | sed 's/^/machine:   /'
            done
          ) &
          python scripts/dev.py check
      - if: runner.os != 'Linux'
        run: python scripts/dev.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-control-${{ matrix.os }}
          path: |
            build/dev-check/
            build/cross-build/
            build/ci-mesa/report.json
